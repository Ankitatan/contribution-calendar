<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GitHub Contribution Calendar</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 25px 12px;
  background: #0d1117;
  color: #e6edf3;
  font-family: Arial, sans-serif;
  text-align: center;
}

.panel {
  max-width: 1050px;
  margin: auto;
  padding: 24px;
  background: #161b22;
  border: 1px solid #30363d;
  border-radius: 14px;
}

h2 {
  color: #d8b4fe;
  margin-top: 0;
}

.subtitle {
  color: #9da7b3;
  font-size: 14px;
}

#status {
  margin: 18px 0;
  color: #c4b5fd;
  font-size: 14px;
}

.calendar-scroll {
  overflow-x: auto;
  padding: 12px 0;
}

.calendar-layout {
  display: grid;
  grid-template-columns: 34px auto;
  gap: 10px;
  width: max-content;
  margin: auto;
}

.weekdays {
  display: grid;
  grid-template-rows: repeat(7, 15px);
  gap: 4px;
  padding-top: 28px;
  text-align: right;
  color: #9da7b3;
  font-size: 11px;
}

.calendar-main {
  width: max-content;
}

.months {
  display: grid;
  grid-template-rows: 18px;
  height: 28px;
  color: #d8b4fe;
  font-size: 12px;
  text-align: left;
}

.month-label {
  white-space: nowrap;
}

.grid {
  display: grid;
  grid-template-rows: repeat(7, 15px);
  grid-auto-flow: column;
  grid-auto-columns: 15px;
  gap: 4px;
}

.day {
  width: 15px;
  height: 15px;
  padding: 0;
  border-radius: 3px;
  cursor: pointer;
  border: 1px solid transparent;
}

.day:hover,
.day:focus-visible {
  outline: 2px solid #f0abfc;
  outline-offset: 2px;
}

.level0 { background: #21262d; }
.level1 { background: #6d28d9; }
.level2 { background: #7c3aed; }
.level3 { background: #a78bfa; }
.level4 { background: #ddd6fe; }

/* Alternate months: outlined squares instead of filled colors */
.day.alternate-month {
  background: transparent;
  border: 1px solid #8b7aa8;
}

.legend {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  margin: 20px 0;
  color: #9da7b3;
  font-size: 12px;
}

.legend .day {
  display: inline-block;
  cursor: default;
}

.details {
  min-height: 70px;
  margin-top: 20px;
  padding: 15px;
  border-radius: 9px;
  background: #0d1117;
  color: #c9d1d9;
  font-size: 14px;
}

a {
  color: #d8b4fe;
  text-decoration: none;
}

a:hover {
  text-decoration: underline;
}

.profile-button {
  display: inline-block;
  margin-top: 18px;
  padding: 10px 18px;
  border-radius: 7px;
  background: #8b5cf6;
  color: white;
}

@media (max-width: 600px) {
  .panel {
    padding: 16px 10px;
  }
}
</style>
</head>

<body>
<div class="panel">
  <h2>GitHub Contribution Calendar</h2>
  <p class="subtitle">
    Real contribution activity for
    <a href="https://github.com/Ankitatan" target="_blank"
       rel="noopener noreferrer">@Ankitatan</a>
  </p>

  <div id="status">Fetching GitHub contribution data...</div>

  <div class="calendar-scroll">
    <div class="calendar-layout">
      <div class="weekdays">
        <span>Sun</span>
        <span></span>
        <span>Tue</span>
        <span></span>
        <span>Thu</span>
        <span></span>
        <span>Sat</span>
      </div>

      <div class="calendar-main">
        <div id="months" class="months"></div>
        <div id="calendar" class="grid"></div>
      </div>
    </div>
  </div>

  <div class="legend">
    <span>Less</span>
    <span class="day level0"></span>
    <span class="day level1"></span>
    <span class="day level2"></span>
    <span class="day level3"></span>
    <span class="day level4"></span>
    <span class="day alternate-month"></span>
    <span>More / outlined months</span>
  </div>

  <div id="details" class="details">
    Select any square to see its contribution count.
  </div>

  <a class="profile-button"
     href="https://github.com/Ankitatan"
     target="_blank" rel="noopener noreferrer">
    View GitHub Profile
  </a>
</div>

<script>
const username = "Ankitatan";

async function loadContributions() {
  const status = document.getElementById("status");
  const calendar = document.getElementById("calendar");
  const months = document.getElementById("months");

  try {
    const response = await fetch(
      `https://github-contributions-api.jogruber.de/v4/${encodeURIComponent(username)}?y=last`
    );

    if (!response.ok) {
      throw new Error(`API returned status ${response.status}`);
    }

    const result = await response.json();
    const days = result.contributions || [];

    if (!days.length) {
      throw new Error("No contribution data was returned.");
    }

    calendar.replaceChildren();
    months.replaceChildren();

    const firstDate = new Date(days[0].date + "T12:00:00");
    const leadingBlanks = firstDate.getDay();
    const totalColumns = Math.ceil(
      (days.length + leadingBlanks) / 7
    );

    calendar.style.gridTemplateColumns =
      `repeat(${totalColumns}, 15px)`;

    months.style.gridTemplateColumns =
      `repeat(${totalColumns}, 15px)`;

    // Add blank cells before the first date.
    for (let i = 0; i < leadingBlanks; i++) {
      const blank = document.createElement("span");
      blank.setAttribute("aria-hidden", "true");
      calendar.appendChild(blank);
    }

    const monthPositions = new Map();
    const monthNames = [
      "Jan", "Feb", "Mar", "Apr", "May", "Jun",
      "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"
    ];

    let totalContributions = 0;

    days.forEach((day, index) => {
      const date = new Date(day.date + "T12:00:00");
      const monthKey =
        `${date.getFullYear()}-${date.getMonth()}`;

      const column = Math.floor(
        (index + leadingBlanks) / 7
      );

      if (!monthPositions.has(monthKey)) {
        monthPositions.set(monthKey, {
          column,
          month: date.getMonth()
        });
      }

      const count = Number(day.count) || 0;
      const level = Math.max(
        0,
        Math.min(4, Number(day.level) || 0)
      );

      totalContributions += count;

      const button = document.createElement("button");
      button.type = "button";
      button.className = `day level${level}`;
      button.title =
        `${day.date}: ${count} contribution${count === 1 ? "" : "s"}`;

      // January colored, February outlined, alternating by month.
      if (date.getMonth() % 2 === 1) {
        button.classList.add("alternate-month");
      }

      button.setAttribute(
        "aria-label",
        `${day.date}, ${count} contributions`
      );

      button.addEventListener("click", () => {
        document.getElementById("details").innerHTML = `
          <strong>${day.date}</strong><br>
          ${count} contribution${count === 1 ? "" : "s"}<br>
          <a href="https://github.com/${username}?tab=overview"
             target="_blank" rel="noopener noreferrer">
            View GitHub activity
          </a>
        `;
      });

      calendar.appendChild(button);
    });

    // Place month labels above the columns where months begin.
    for (const [key, position] of monthPositions) {
      const label = document.createElement("span");
      label.className = "month-label";
      label.style.gridColumn = String(position.column + 1);
      label.textContent = monthNames[position.month];
      months.appendChild(label);
    }

    status.textContent =
      `${totalContributions.toLocaleString()} contributions in the displayed year`;

  } catch (error) {
    console.error("Unable to load contributions:", error);
    status.textContent =
      "Unable to fetch contribution data. Please refresh and try again.";
  }
}

loadContributions();
</script>
</body>
</html>
