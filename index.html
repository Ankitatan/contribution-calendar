<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitHub Contribution Calendar</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 25px 12px;
  background: #0d1117;
  color: #e6edf3;
  font-family: Arial, sans-serif;
}

.panel {
  max-width: 1200px;
  margin: auto;
  padding: 24px;
  background: #161b22;
  border: 1px solid #30363d;
  border-radius: 14px;
}

h2 {
  text-align: center;
  color: #d8b4fe;
  margin: 0 0 10px;
}

.subtitle {
  text-align: center;
  color: #9da7b3;
  font-size: 14px;
}

.controls {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin: 20px 0;
}

select {
  padding: 9px 12px;
  color: #e6edf3;
  background: #0d1117;
  border: 1px solid #8b5cf6;
  border-radius: 7px;
  font-size: 14px;
}

#status {
  text-align: center;
  color: #c4b5fd;
  font-size: 14px;
  margin: 15px 0;
}

.calendar-scroll {
  overflow-x: auto;
  padding: 12px 0 18px;
}

.calendar-layout {
  display: grid;
  grid-template-columns: 32px auto;
  gap: 10px;
  width: max-content;
  margin: auto;
}

.weekdays {
  display: grid;
  grid-template-rows: repeat(7, 15px);
  gap: 4px;
  padding-top: 28px;
  color: #9da7b3;
  font-size: 11px;
  text-align: right;
}

.calendar-main {
  width: max-content;
}

.months {
  display: grid;
  grid-template-rows: 18px;
  height: 28px;
  gap: 4px;
  color: #d8b4fe;
  font-size: 12px;
  text-align: left;
}

.month-label {
  white-space: nowrap;
}

.grid {
  display: grid;
  grid-template-rows: repeat(7, 15px);
  grid-auto-flow: column;
  grid-auto-columns: 15px;
  gap: 4px;
}

.day {
  width: 15px;
  height: 15px;
  padding: 0;
  border: 1px solid transparent;
  border-radius: 3px;
  cursor: pointer;
}

.level0 { background: #21262d; }
.level1 { background: #6d28d9; }
.level2 { background: #7c3aed; }
.level3 { background: #a78bfa; }
.level4 { background: #ddd6fe; }

/* Alternate months display outlined squares */
.day.alternate-month {
  background: transparent;
  border: 1px solid #8b7aa8;
}

.day:hover,
.day:focus-visible {
  outline: 2px solid #f0abfc;
  outline-offset: 2px;
}

.legend {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 7px;
  margin: 15px 0;
  color: #9da7b3;
  font-size: 12px;
}

.legend .day {
  display: inline-block;
  cursor: default;
}

.details {
  min-height: 75px;
  padding: 15px;
  margin-top: 20px;
  background: #0d1117;
  border-radius: 9px;
  color: #c9d1d9;
  text-align: center;
  font-size: 14px;
  line-height: 1.8;
}

a {
  color: #d8b4fe;
  text-decoration: none;
}

a:hover { text-decoration: underline; }

.profile-link {
  display: block;
  width: fit-content;
  margin: 20px auto 0;
  padding: 10px 18px;
  background: #8b5cf6;
  color: white;
  border-radius: 7px;
}

@media (max-width: 600px) {
  .panel { padding: 16px 10px; }
}
</style>
</head>

<body>
<div class="panel">
  <h2>GitHub Contribution Calendar</h2>

  <p class="subtitle">
    <a href="https://github.com/Ankitatan"
       target="_blank" rel="noopener noreferrer">
      @Ankitatan
    </a>
  </p>

  <div class="controls">
    <label for="yearSelect">Select year:</label>
    <select id="yearSelect"></select>
  </div>

  <div id="status">Loading contribution data...</div>

  <div class="calendar-scroll">
    <div class="calendar-layout">
      <div class="weekdays">
        <span>Sun</span>
        <span></span>
        <span>Tue</span>
        <span></span>
        <span>Thu</span>
        <span></span>
        <span>Sat</span>
      </div>

      <div class="calendar-main">
        <div id="months" class="months"></div>
        <div id="calendar" class="grid"></div>
      </div>
    </div>
  </div>

  <div class="legend">
    <span>Less</span>
    <span class="day level0"></span>
    <span class="day level1"></span>
    <span class="day level2"></span>
    <span class="day level3"></span>
    <span class="day level4"></span>
    <span class="day alternate-month"></span>
    <span>Outlined month</span>
  </div>

  <div id="details" class="details">
    Select a square to see the daily contribution count.
  </div>

  <a class="profile-link"
     href="https://github.com/Ankitatan"
     target="_blank" rel="noopener noreferrer">
    View GitHub Profile
  </a>
</div>

<script>
const username = "Ankitatan";
const currentYear = new Date().getFullYear();

const yearSelect = document.getElementById("yearSelect");
const status = document.getElementById("status");
const calendar = document.getElementById("calendar");
const months = document.getElementById("months");
const details = document.getElementById("details");

const monthNames = [
  "Jan", "Feb", "Mar", "Apr", "May", "Jun",
  "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"
];

// Offer calendar years from 2015 through the current year.
for (let year = currentYear; year >= 2015; year--) {
  const option = document.createElement("option");
  option.value = year;
  option.textContent = year;
  yearSelect.appendChild(option);
}

yearSelect.value = currentYear;

yearSelect.addEventListener("change", () => {
  loadContributions(Number(yearSelect.value));
});

async function loadContributions(year) {
  status.textContent = `Fetching ${year} contribution data...`;
  calendar.replaceChildren();
  months.replaceChildren();

  details.textContent =
    "Select a square to see the daily contribution count.";

  try {
    const url =
      `https://github-contributions-api.jogruber.de/v4/` +
      `${encodeURIComponent(username)}?y=${year}`;

    const response = await fetch(url);

    if (!response.ok) {
      throw new Error(`API error: ${response.status}`);
    }

    const result = await response.json();

    // Keep only dates belonging to the selected calendar year.
    const days = (result.contributions || []).filter(day =>
      day.date.startsWith(`${year}-`)
    );

    if (!days.length) {
      throw new Error(`No data returned for ${year}.`);
    }

    const dailyData = new Map(days.map(day => [day.date, day]));

    // Build every date from January 1 through December 31.
    const start = new Date(year, 0, 1, 12);
    const end = new Date(year, 11, 31, 12);

    // Sunday-first grid: align January 1 to its weekday.
    const leadingBlanks = start.getDay();
    const dayCount =
      Math.round((end - start) / 86400000) + 1;

    const totalColumns =
      Math.ceil((leadingBlanks + dayCount) / 7);

    calendar.style.gridTemplateColumns =
      `repeat(${totalColumns}, 15px)`;

    months.style.gridTemplateColumns =
      `repeat(${totalColumns}, 15px)`;

    // Blank squares before January 1.
    for (let i = 0; i < leadingBlanks; i++) {
      const blank = document.createElement("span");
      blank.setAttribute("aria-hidden", "true");
      calendar.appendChild(blank);
    }

    let annualTotal = 0;

    for (let index = 0; index < dayCount; index++) {
      const date = new Date(start);
      date.setDate(start.getDate() + index);

      const dateString =
        `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;

      const apiDay = dailyData.get(dateString);
      const count = Number(apiDay?.count) || 0;
      const level = Math.max(
        0,
        Math.min(4, Number(apiDay?.level) || 0)
      );

      annualTotal += count;

      const button = document.createElement("button");
      button.type = "button";
      button.className = `day level${level}`;
      button.title =
        `${dateString}: ${count} contribution${count === 1 ? "" : "s"}`;
      button.setAttribute(
        "aria-label",
        `${dateString}, ${count} contributions`
      );

      // January colored, February outlined, alternating monthly.
      if (date.getMonth() % 2 === 1) {
        button.classList.add("alternate-month");
      }

      button.addEventListener("click", () => {
        details.innerHTML = `
          <strong>${dateString}</strong><br>
          ${count} contribution${count === 1 ? "" : "s"}<br>
          <a href="https://github.com/${username}?tab=overview"
             target="_blank" rel="noopener noreferrer">
            View GitHub activity
          </a>
        `;
      });

      calendar.appendChild(button);
    }

    // Add trailing blanks so the calendar ends at a full week.
    const trailingBlanks =
      totalColumns * 7 - leadingBlanks - dayCount;

    for (let i = 0; i < trailingBlanks; i++) {
      const blank = document.createElement("span");
      blank.setAttribute("aria-hidden", "true");
      calendar.appendChild(blank);
    }

    // Fixed January–December labels across the full year.
    for (let month = 0; month < 12; month++) {
      const firstOfMonth = new Date(year, month, 1, 12);
      const column = Math.floor(
        (leadingBlanks +
          Math.round((firstOfMonth - start) / 86400000)) / 7
      );

      const label = document.createElement("span");
      label.className = "month-label";
      label.style.gridColumn = String(column + 1);
      label.textContent = monthNames[month];
      months.appendChild(label);
    }

    status.textContent =
      `${year} · ${annualTotal.toLocaleString()} contributions`;

  } catch (error) {
    console.error(error);
    status.textContent =
      `Could not load ${year} data. Please try again later.`;
  }
}

loadContributions(currentYear);
</script>
</body>
</html>
