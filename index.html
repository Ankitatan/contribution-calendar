
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitHub Contribution Calendar</title>
<style>
*{box-sizing:border-box}
body{background:#0d1117;color:#e6edf3;font-family:Arial,sans-serif;padding:30px;max-width:1400px;width:100%;margin:0 auto;text-align:center}
h1{color:#c4b5fd}
.panel{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:24px;margin:20px auto 0;width:100%;max-width:1400px;text-align:left}
.github-button{display:inline-block;padding:10px 20px;background:linear-gradient(90deg,#c8a2e8,#ff9ecf);color:#4c1d65;text-decoration:none;border-radius:8px;font-weight:bold}
.github-button:hover{opacity:.8}
.calendar-scroll{width:100%;overflow-x:auto;padding-bottom:10px}
.calendar-inner{width:max-content}
#months{display:grid;grid-template-rows:20px;grid-auto-flow:column;grid-auto-columns:15px;gap:4px;margin-bottom:8px;height:20px}
.month-label{color:#c4b5fd;font-size:11px;white-space:nowrap;overflow:visible}
.calendar-layout{display:flex;align-items:flex-start;gap:8px}
.weekdays{display:grid;grid-template-rows:repeat(7,15px);gap:4px;flex-shrink:0;color:#c4b5fd;font-size:10px}
.weekdays span{height:15px;line-height:15px}
#calendar{display:grid;grid-template-rows:repeat(7,15px);grid-auto-flow:column;grid-auto-columns:15px;gap:4px}
.day{width:15px;height:15px;border-radius:3px;border:0;cursor:pointer;padding:0}
.level0{background:#21262d}
.level1{background:#6d28d9}
.level2{background:#7c3aed}
.level3{background:#a78bfa}
.level4{background:#ddd6fe}
.day.alternate-month{background:transparent;border:1px solid #6b5b7e}
.day:hover,.day:focus{outline:2px solid white}
#details{line-height:1.8}
.legend{display:flex;align-items:center;gap:4px;font-size:12px;margin-top:12px}
.legend-square{width:12px;height:12px;border-radius:2px}
a{color:#c4b5fd}
@media(max-width:600px){body{padding:15px}.panel{padding:14px}}
</style>
</head>
<body>
<div align="center">
<h1>✨ Contribution Activity</h1>
<p>Explore your GitHub contributions by month. Click any square for details.</p>
</div>

<div class="panel">
<strong id="summary">Loading contributions...</strong>
<div class="calendar-scroll">
<div class="calendar-inner">
<div id="months"></div>
<div class="calendar-layout">
<div class="weekdays">
<span></span><span>Mon</span><span></span><span>Wed</span><span></span><span>Fri</span><span></span>
</div>
<div id="calendar"></div>
</div>
</div>
</div>
<div class="legend">Less
<span class="legend-square" style="background:#21262d"></span>
<span class="legend-square" style="background:#6d28d9"></span>
<span class="legend-square" style="background:#7c3aed"></span>
<span class="legend-square" style="background:#a78bfa"></span>
<span class="legend-square" style="background:#ddd6fe"></span>
More
</div>
<p style="font-size:12px;color:#c4b5fd">Alternate months use transparent bordered squares.</p>
</div>

<div class="panel" id="details">
<strong>Select a day</strong>
<p>Your date and contribution details will appear here.</p>
</div>

<p>
<a href="https://github.com/Ankitatan" target="_blank" rel="noopener noreferrer" class="github-button">View GitHub Profile →</a>
</p>

<script>
const username="Ankitatan";
const calendar=document.getElementById("calendar");
const months=document.getElementById("months");
const details=document.getElementById("details");

async function loadCalendar(){
try{
const response=await fetch(`https://github-contributions-api.jogruber.de/v4/${username}?y=last`);
if(!response.ok)throw new Error("Contribution data unavailable");
const data=await response.json();
const days=data.contributions;
if(!days||!days.length)throw new Error("No contribution data found");

document.getElementById("summary").textContent=
`${days.reduce((sum,day)=>sum+day.count,0)} contributions in the past year`;

const firstDate=new Date(days[0].date+"T12:00:00");
const leadingBlanks=firstDate.getDay();

for(let i=0;i<leadingBlanks;i++)calendar.appendChild(document.createElement("span"));

const monthPositions=new Map();

days.forEach((day,index)=>{
const date=new Date(day.date+"T12:00:00");
const column=Math.floor((index+leadingBlanks)/7);
const monthKey=`${date.getFullYear()}-${date.getMonth()}`;

if(!monthPositions.has(monthKey)){
monthPositions.set(monthKey,{
label:date.toLocaleDateString("en-US",{month:"short"}),
column
});
}

const button=document.createElement("button");
const level=Math.max(0,Math.min(4,Number(day.level)||0));
button.className=`day level${level}`;

// Alternate months: January colored, February outlined, and so on.
if(date.getMonth()%2===1){
button.classList.add("alternate-month");
}
button.title=`${day.date}: ${day.count} contributions`;
button.setAttribute("aria-label",button.title);

button.addEventListener("click",()=>{
const heading=document.createElement("strong");
heading.textContent=date.toLocaleDateString("en-US",{
year:"numeric",month:"long",day:"numeric"
});
const paragraph=document.createElement("p");
paragraph.textContent=`${day.count} contribution${day.count===1?"":"s"}`;
const link=document.createElement("a");
link.className="github-button";
link.href=`https://github.com/${username}?tab=overview`;
link.target="_blank";
link.rel="noopener noreferrer";
link.textContent="View Activity on GitHub →";
details.replaceChildren(heading,paragraph,link);
});
calendar.appendChild(button);
});

const totalColumns=Math.ceil((days.length+leadingBlanks)/7);
months.style.gridTemplateColumns=`repeat(${totalColumns},15px)`;

for(const {label,column} of monthPositions.values()){
const labelElement=document.createElement("span");
labelElement.className="month-label";
labelElement.textContent=label;
labelElement.style.gridColumn=`${column+1}/span 1`;
months.appendChild(labelElement);
}
}catch(error){
document.getElementById("summary").textContent="Unable to load contributions. Please try again later.";
console.error(error);
}
}
loadCalendar();
</script>
</body>
</html>
