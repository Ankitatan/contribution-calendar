<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitHub Contribution Calendar</title>

<style>
* {
  box-sizing: border-box;
}

body {
  background: #0d1117;
  color: #e6edf3;
  font-family: Arial, sans-serif;
  padding: 30px;
  max-width: 1400px;
  width: 100%;
  margin: 0 auto;
  text-align: center;
}

.panel {
  background: #161b22;
  border: 1px solid #30363d;
  border-radius: 12px;
  padding: 24px;
  margin: 20px auto 0;
  width: 100%;
  max-width: 1400px;
  box-sizing: border-box;
  text-align: left;
}


.calendar-scroll {
  width: 100%;
  overflow-x: auto;
  padding-bottom: 10px;
}

h1 {
  color: #c4b5fd;
}


.github-button {
  display: inline-block;
  padding: 10px 20px;
  background: linear-gradient(90deg, #c8a2e8, #ff9ecf);
  color: #4c1d65;
  text-decoration: none;
  border-radius: 8px;
  font-weight: bold;
  transition: opacity 0.3s ease;
}

.github-button:hover {
  opacity: 0.8;
}


.calendar-inner {
  width: max-content;
}

#months {
  display: grid;
  grid-template-rows: 20px;
  grid-auto-flow: column;
  grid-auto-columns: 15px;
  gap: 4px;
  margin-bottom: 8px;
  height: 20px;
}

.month-label {
  color: #c4b5fd;
  font-size: 11px;
  white-space: nowrap;
  overflow: visible;
}

#calendar {
  display: grid;
  grid-template-rows: repeat(7, 15px);
  grid-auto-flow: column;
  grid-auto-columns: 15px;
  gap: 4px;
}

.day {
  width: 15px;
  height: 15px;
  border-radius: 3px;
  border: 0;
  cursor: pointer;
  padding: 0;
}

.day:hover,
.day:focus {
  outline: 2px solid white;
}

.level0 { background: #21262d; }
.level1 { background: #6d28d9; }
.level2 { background: #7c3aed; }
.level3 { background: #a78bfa; }
.level4 { background: #ddd6fe; }

a {
  color: #c4b5fd;
}

#details {
  line-height: 1.8;
}

.legend {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 12px;
  margin-top: 12px;
}

.legend-square {
  width: 12px;
  height: 12px;
  border-radius: 2px;
}

@media (max-width: 600px) {
  body {
    padding: 15px;
  }

  .panel {
    padding: 14px;
  }
}
</style>
</head>

<body>
<div align="center"><h1>✨ Contribution Activity</h1>
<p>Explore your GitHub contributions by month. Click any square for details.</p>
</div>
<div align="center" class="panel">
  <strong id="summary">Loading contributions...</strong>

  <div class="calendar-scroll">
    <div class="calendar-inner">
      <div id="months"></div>
      <div id="calendar"></div>
    </div>
  </div>

  <div class="legend">
    Less
    <span class="legend-square level0"></span>
    <span class="legend-square level1"></span>
    <span class="legend-square level2"></span>
    <span class="legend-square level3"></span>
    <span class="legend-square level4"></span>
    More
  </div>
</div>

<div class="panel" id="details">
  <strong>Select a day</strong>
  <p>Your date and contribution details will appear here.</p>
</div>
<div align="center">
<p>
  <a href="https://github.com/Ankitatan"
     target="_blank"
     rel="noopener noreferrer"
     class="github-button">
    View GitHub Profile →
  </a>
</p>
</div>
<script>
const username = "Ankitatan";
const calendar = document.getElementById("calendar");
const months = document.getElementById("months");
const details = document.getElementById("details");

async function loadCalendar() {
  try {
    const response = await fetch(
      `https://github-contributions-api.jogruber.de/v4/${username}?y=last`
    );

    if (!response.ok) {
      throw new Error("Contribution data unavailable");
    }

    const data = await response.json();
    const days = data.contributions;

    if (!days || days.length === 0) {
      throw new Error("No contribution data found");
    }

    document.getElementById("summary").textContent =
      `${days.reduce((sum, day) => sum + day.count, 0)} contributions in the past year`;

    // Start the calendar on Sunday.
    const firstDate = new Date(days[0].date + "T12:00:00");
    const leadingBlanks = firstDate.getDay();

    for (let i = 0; i < leadingBlanks; i++) {
      calendar.appendChild(document.createElement("span"));
    }

    // Map each calendar week to its starting date.
    const firstSunday = new Date(firstDate);
    firstSunday.setDate(firstSunday.getDate() - leadingBlanks);

    const monthPositions = new Map();

    days.forEach((day, index) => {
      const date = new Date(day.date + "T12:00:00");
      const column = Math.floor((index + leadingBlanks) / 7);
      const monthKey = `${date.getFullYear()}-${date.getMonth()}`;

      if (!monthPositions.has(monthKey)) {
        monthPositions.set(monthKey, {
          label: date.toLocaleDateString("en-US", { month: "short" }),
          column
        });
      }

      const button = document.createElement("button");
      const level = Math.max(0, Math.min(4, Number(day.level) || 0));

      button.className = `day level${level}`;
      button.title = `${day.date}: ${day.count} contributions`;
      button.setAttribute("aria-label", button.title);

      button.addEventListener("click", () => {
        const formattedDate = date.toLocaleDateString("en-US", {
          year: "numeric",
          month: "long",
          day: "numeric"
        });

        details.replaceChildren();

        const heading = document.createElement("strong");
        heading.textContent = formattedDate;

        const paragraph = document.createElement("p");
        paragraph.textContent =
          `${day.count} contribution${day.count === 1 ? "" : "s"}`;

        const link = document.createElement("a");
        link.className = "github-button";
        link.href = `https://github.com/${username}?tab=overview`;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = "View Activity on GitHub →";

        details.append(heading, paragraph, link);
      });

      calendar.appendChild(button);
    });

    // Create month labels aligned with their calendar columns.
    const totalColumns = Math.ceil((days.length + leadingBlanks) / 7);
    months.style.gridTemplateColumns =
      `repeat(${totalColumns}, 15px)`;

    let previousColumn = -1;

    for (const { label, column } of monthPositions.values()) {
      if (column === previousColumn) continue;
      previousColumn = column;

      const labelElement = document.createElement("span");
      labelElement.className = "month-label";
      labelElement.textContent = label;
      labelElement.style.gridColumn = `${column + 1} / span 1`;

      months.appendChild(labelElement);
    }
  } catch (error) {
    document.getElementById("summary").textContent =
      "Unable to load contributions. Please try again later.";
    console.error(error);
  }
}

loadCalendar();
</script>
</body>
</html>
